name: Pages

# Build the notebooks with Notebook Kit. Pull requests only build. Pushes to main deploy to GitHub Pages.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check the lockfile regenerates from package.json
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package-lock.json
      - name: Check every package resolves from the npm registry
        run: npx -y lockfile-lint@5.1.0 --path package-lock.json --allowed-hosts npm --validate-https --validate-integrity --validate-package-names
      - run: npm ci
      - run: npm run build
      # Pages serves the site under /stillwell-notebooks, so a root path such as fetch("/data.json") or href="/" breaks
      # there. The notebooks are checked as written, since compiled cells sit in minified bundles whose library code
      # has strings like `/` too. The built HTML and CSS are checked for root paths in attributes.
      - name: Check for root paths
        run: |
          if grep -noE "(=|\(|:)[[:space:]]*[\"'\`]/([^/\"'\`]|[\"'\`])|url\(/" notebooks/*.html | head -20 | grep .; then
            exit 1
          fi
          if grep -rnoIE "[a-z-]+=[\"']/([^/\"']|[\"'])" dist --include='*.html' --include='*.css' | head -20 | grep .; then
            exit 1
          fi
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
